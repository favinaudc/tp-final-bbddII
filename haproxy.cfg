global
    maxconn 4096
    log stdout format raw local0

defaults
    log global
    mode tcp
    option tcplog
    option clitcpka
    timeout connect 5s
    timeout client 10m
    timeout server 10m

# DNS interno de Docker para re-resolver IPs cuando un contenedor cae y reinicia
resolvers docker_dns
    nameserver dns1 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 5s

# Panel web de estadísticas de HAProxy (http://localhost:8404/stats)
listen stats
    bind :8404
    mode http
    stats enable
    stats uri /stats
    stats refresh 3s
    stats show-legends
    stats show-node

# Punto único de acceso SQL (balanceo TCP hacia los 3 nodos)
listen cockroach_sql
    bind :26257
    mode tcp
    balance roundrobin
    option httpchk
    http-check send meth GET uri /health?ready=1
    http-check expect status 200
    default-server inter 2s fall 2 rise 2 resolvers docker_dns init-addr libc,none
    server crdb-node1 crdb-node1:26257 check port 8080
    server crdb-node2 crdb-node2:26257 check port 8080
    server crdb-node3 crdb-node3:26257 check port 8080
